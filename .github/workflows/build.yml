name: Start build
on:
  workflow_dispatch:

jobs:
  Building:
    runs-on: ubuntu-latest

    steps:
    - name: 🔄 Checkout Code
      uses: actions/checkout@v5

    - name: 📦 Install Dependencies
      run: |
        sudo apt update -y
        sudo apt install bc cpio flex bison aptitude git python-is-python3 tar aria2 perl wget curl lz4 libssl-dev -y

    - name: 🔧 Clone Toolchains
      run: |
        git clone --depth=1 https://github.com/techyminati/android_prebuilts_clang_host_linux-x86_clang-6443078 clang
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

    - name: ⚙️ Setup Environment
      run: |
        echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> $GITHUB_ENV
        echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> $GITHUB_ENV
        echo "GCC32_PATH=$GITHUB_WORKSPACE/gcc32" >> $GITHUB_ENV

    - name: 🛠️ Build Kernel
      run: |
        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"
        export KBUILD_BUILD_USER=Llorens
        export KBUILD_BUILD_HOST=MKernel
        mkdir -p out
        make O=out ARCH=arm64 agate_defconfig
        make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE="$GCC64_PATH/bin/aarch64-linux-android-" \
          CROSS_COMPILE_ARM32="$GCC32_PATH/bin/arm-linux-androideabi-" \
          Image.gz CONFIG_NO_ERROR_ON_MISMATCH=y 2>&1 | tee error.log


    - name: 📂 Clone Anykernel3 & Zip
      run: |
        git clone --depth=1 https://github.com/r0xx3z/Ak3.git -b Agate AnyKernel3
        cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
        cd AnyKernel3
        zip -r "../MKernel.zip" *

    - name: 📤 Upload Flashable zip
      uses: actions/upload-artifact@v5
      with:
        name: MKernel
        path: AnyKernel3/*
